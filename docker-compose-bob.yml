services:
  qkd_server_bob:
    build: ./server
    container_name: qkd_server_bob
    environment:
      - SERVER_PORT=25576
    volumes:
      - qkd_shared_bob:/dev/shm
    ports:
      - "25576:25576"

  generate_key_bob:
    build: ./keys
    container_name: generate_key_bob
    environment:
      - BUFFER_SIZE=100000  # Key buffer size
      - BUFFER_PATH=/dev/shm/qkd_buffer  # Key buffer memory path
      - MODE=receiver  # Sender or receiver mode (Alice or Bob)
      - PORT=5000  # Receiver host port
      - SKR=100  # Secret Key Rate (in bytes per second)
    volumes:
      - qkd_shared_bob:/dev/shm
    ports:
      - "5000:5000"

volumes:
  qkd_shared_bob:
    driver_opts:
      type: tmpfs
      device: tmpfs
