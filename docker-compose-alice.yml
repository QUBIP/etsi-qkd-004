services:
  qkd_server_alice:
    build: ./server
    container_name: qkd_server_alice
    environment:
      - SERVER_PORT=25575
    volumes:
      - qkd_shared_alice:/dev/shm
    ports:
      - "25575:25575"

  generate_key_alice:
    build: ./keys
    container_name: generate_key_alice
    environment:
      - BUFFER_SIZE=100000  # Key buffer size
      - BUFFER_PATH=/dev/shm/qkd_buffer  # Key buffer memory path
      - MODE=sender  # Sender or receiver mode (Alice or Bob)
      - HOST=192.168.0.157  # Receiver host address
      - PORT=5000  # Receiver host port
      - SKR=100  # Secret Key Rate (in bytes per second)
    volumes:
      - qkd_shared_alice:/dev/shm

volumes:
  qkd_shared_alice:
    driver_opts:
      type: tmpfs
      device: tmpfs