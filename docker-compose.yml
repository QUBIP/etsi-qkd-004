services:
  qkd_server_alice:
    build: ./server
    container_name: qkd_server_alice
    environment:
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_alice.pem
      - SERVER_CERT_KEY=/certs/server_key_qkd_server_alice.pem
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_alice.pem
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=25575
      - BUFFER_PATH=/dev/shm/qkd_buffer
      - BUFFER_SIZE=1000000
      - QOS_KEY_CHUNK_SIZE=1000000
      - QOS_MAX_BPS=500000
      - QOS_MIN_BPS=5000
      - QOS_JITTER=5
      - QOS_PRIORITY=0
      - QOS_TIMEOUT=5000
      - QOS_TTL=7200
    volumes:
      - ./certs:/certs
      - qkd_shared_alice:/dev/shm
    ports:
      - "25575:25575"
    networks:
      - qkd_network

  qkd_server_bob:
    build: ./server
    container_name: qkd_server_bob
    environment:
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_bob.pem
      - SERVER_CERT_KEY=/certs/server_key_qkd_server_bob.pem
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_bob.pem
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=25576
      - BUFFER_PATH=/dev/shm/qkd_buffer
      - BUFFER_SIZE=1000000
      - QOS_KEY_CHUNK_SIZE=1000000
      - QOS_MAX_BPS=500000
      - QOS_MIN_BPS=5000
      - QOS_JITTER=5
      - QOS_PRIORITY=0
      - QOS_TIMEOUT=5000
      - QOS_TTL=7200
    volumes:
      - ./certs:/certs
      - qkd_shared_bob:/dev/shm
    ports:
      - "25576:25576"
    networks:
      - qkd_network

  qkd_client_alice:
    build: ./client
    container_name: qkd_client_alice
    environment:
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_alice.pem
      - CLIENT_CERT_KEY=/certs/client_key_qkd_server_alice.pem
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_alice.pem
      - SERVER_ADDRESS=qkd_server_alice
      - CLIENT_ADDRESS=localhost
      - SERVER_PORT=25575
      - KEY_INDEX=0
      - METADATA_SIZE=1024
      - QOS_KEY_CHUNK_SIZE=32
      - QOS_MAX_BPS=40000
      - QOS_MIN_BPS=5000
      - QOS_JITTER=10
      - QOS_PRIORITY=0
      - QOS_TIMEOUT=5000
      - QOS_TTL=3600
    volumes:
      - ./certs:/certs
    networks:
      - qkd_network

  qkd_client_bob:
    build: ./client
    container_name: qkd_client_bob
    environment:
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_bob.pem
      - CLIENT_CERT_KEY=/certs/client_key_qkd_server_bob.pem
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_bob.pem
      - SERVER_ADDRESS=qkd_server_bob
      - CLIENT_ADDRESS=localhost
      - SERVER_PORT=25576
      - KEY_INDEX=0
      - METADATA_SIZE=1024
      - QOS_KEY_CHUNK_SIZE=32
      - QOS_MAX_BPS=40000
      - QOS_MIN_BPS=5000
      - QOS_JITTER=10
      - QOS_PRIORITY=0
      - QOS_TIMEOUT=5000
      - QOS_TTL=3600
    volumes:
      - ./certs:/certs
    networks:
      - qkd_network

  generate_key_alice:
    build: ./keys
    container_name: generate_key_alice
    environment:
      - BUFFER_SIZE=1000000
      - BUFFER_PATH=/dev/shm/qkd_buffer
      - MODE=sender
      - HOST=generate_key_bob
      - PORT=5000
      - SKR=12500
    volumes:
      - qkd_shared_alice:/dev/shm
    networks:
      - qkd_network

  generate_key_bob:
    build: ./keys
    container_name: generate_key_bob
    environment:
      - BUFFER_SIZE=1000000
      - BUFFER_PATH=/dev/shm/qkd_buffer
      - MODE=receiver
      - PORT=5000
      - SKR=12500
    volumes:
      - qkd_shared_bob:/dev/shm
    networks:
      - qkd_network
    ports:
      - "5000:5000"

  qkd_tests_alice:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    container_name: qkd_tests_alice
    depends_on:
      - qkd_server_alice
      - qkd_server_bob
      - generate_key_alice
      - generate_key_bob
    environment:
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_alice.pem
      - CLIENT_CERT_KEY=/certs/client_key_qkd_server_alice.pem
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_alice.pem
      - SERVER_ADDRESS=qkd_server_alice
      - CLIENT_ADDRESS=localhost
      - SERVER_PORT=25575
    volumes:
      - ./certs:/certs
    networks:
      - qkd_network

  qkd_tests_bob:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    container_name: qkd_tests_bob
    depends_on:
      - qkd_server_alice
      - qkd_server_bob
      - generate_key_alice
      - generate_key_bob
    environment:
      - CLIENT_CERT_PEM=/certs/client_cert_qkd_server_bob.pem
      - CLIENT_CERT_KEY=/certs/client_key_qkd_server_bob.pem
      - SERVER_CERT_PEM=/certs/server_cert_qkd_server_bob.pem
      - SERVER_ADDRESS=qkd_server_bob
      - CLIENT_ADDRESS=localhost
      - SERVER_PORT=25576
    volumes:
      - ./certs:/certs
    networks:
      - qkd_network

networks:
  qkd_network:
    driver: bridge

volumes:
  qkd_shared_alice:
    driver_opts:
      type: tmpfs
      device: tmpfs
  qkd_shared_bob:
    driver_opts:
      type: tmpfs
      device: tmpfs
